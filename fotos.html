<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Compartí tus fotos — Mari & Fer</title>
  <meta name="description" content="Subí tus fotos del casamiento de Mari y Fer.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Dancing+Script:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=16">
  <link rel="stylesheet" href="css/fotos.css?v=1">
</head>
<body>

  <!-- Header -->
  <header class="fotos-hero">
    <div class="floral-bg">
      <div class="floral-corner top-left"></div>
      <div class="floral-corner top-right"></div>
    </div>
    <div class="fotos-hero-content">
      <div class="fotos-hero-names">Mari <span class="amp">&</span> Fer</div>
      <h1 class="fotos-hero-title">Compartí tus fotos</h1>
      <p class="fotos-hero-sub">Ayudanos a guardar los recuerdos de este día tan especial.</p>
    </div>
  </header>

  <main class="container">

    <!-- UPLOAD -->
    <section class="fotos-section" id="subir">
      <div class="upload-card" id="upload-card">
        <div class="upload-buttons">
          <label class="upload-btn" for="camera-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Tomar foto
          </label>
          <label class="upload-btn" for="gallery-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Elegir de galería
          </label>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" multiple style="display:none">
        <input type="file" id="gallery-input" accept="image/*" multiple style="display:none">
        <div class="file-list" id="file-list"></div>
        <div class="file-count" id="file-count"></div>

        <div class="field">
          <input type="text" id="guest-name" placeholder="Tu nombre (opcional)" maxlength="50">
        </div>

        <button class="submit-btn" id="submit-btn" disabled>Subir foto</button>
        <div class="status-msg" id="status-msg"></div>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="fotos-section" id="galeria">
      <div class="gallery-header">
        <div class="gallery-title">Galería</div>
        <p class="gallery-sub" id="gallery-sub">Las fotos que ya compartieron</p>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
      <div class="gallery-empty" id="gallery-empty" style="display:none;">
        Todavía no hay fotos. ¡Sé el primero en compartir!
      </div>
      <div class="pagination" id="pagination" style="display:none;">
        <button class="page-btn" id="prev-btn">&larr; Anterior</button>
        <span class="page-info" id="page-info"></span>
        <button class="page-btn" id="next-btn">Siguiente &rarr;</button>
      </div>
    </section>

  </main>

  <footer class="fotos-footer">
    <div class="footer-names">Mari & Fer</div>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="js/fotos.js?v=1"></script>
</body>
</html>
