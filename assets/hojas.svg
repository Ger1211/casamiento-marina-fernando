<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Olive branch -->
  <g filter="url(#watercolor)" opacity="0.9">
    <path d="M100 180 Q95 140 70 110 Q45 80 20 75" 
          fill="none" stroke="#7A8B6E" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <ellipse cx="70" cy="110" rx="18" ry="10" fill="#7A8B6E" transform="rotate(-35 70 110)"/>
    <ellipse cx="55" cy="95" rx="16" ry="9" fill="#8FA080" transform="rotate(-55 55 95)"/>
    <ellipse cx="45" cy="120" rx="17" ry="9" fill="#7A8B6E" transform="rotate(-20 45 120)"/>
    <ellipse cx="35" cy="85" rx="15" ry="8" fill="#8FA080" transform="rotate(-70 35 85)"/>
    <ellipse cx="25" cy="105" rx="16" ry="9" fill="#6B7A60" transform="rotate(-10 25 105)"/>
    <ellipse cx="20" cy="75" rx="14" ry="8" fill="#8FA080" transform="rotate(-85 20 75)"/>
  </g>
  
  <!-- Soft blue flowers -->
  <g opacity="0.7">
    <circle cx="85" cy="100" r="8" fill="#A8C8D8"/>
    <circle cx="80" cy="95" r="5" fill="#D4E6EE"/>
    <circle cx="90" cy="95" r="5" fill="#D4E6EE"/>
    <circle cx="80" cy="105" r="5" fill="#D4E6EE"/>
    <circle cx="90" cy="105" r="5" fill="#D4E6EE"/>
    <circle cx="85" cy="100" r="3" fill="#F7F6F2"/>
  </g>
  
  <g opacity="0.6">
    <circle cx="60" cy="130" r="6" fill="#A8C8D8"/>
    <circle cx="56" cy="127" r="4" fill="#D4E6EE"/>
    <circle cx="64" cy="127" r="4" fill="#D4E6EE"/>
    <circle cx="56" cy="133" r="4" fill="#D4E6EE"/>
    <circle cx="64" cy="133" r="4" fill="#D4E6EE"/>
    <circle cx="60" cy="130" r="2.5" fill="#F7F6F2"/>
  </g>
</svg>
